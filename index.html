<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>ระบบข้อมูลพื้นที่ชุมชน</title>
  <style>
    :root { color-scheme: light; --navy:#0e2a47; --gold:#c8a45a; --paper:#f6f8fb; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--paper); color:var(--navy); font:20px system-ui,sans-serif; }
    main { width:min(100%,620px); padding:32px; background:#fff; border-radius:20px; box-shadow:0 10px 30px #0e2a4720; text-align:center; }
    h1 { margin:0 0 14px; font-size:1.45rem; }
    p { margin:0; line-height:1.7; color:#435466; }
    .mark { width:62px; height:62px; margin:0 auto 18px; border-radius:50%; display:grid; place-items:center; background:var(--navy); color:var(--gold); font-size:1.7rem; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">⌖</div>
    <h1>ระบบข้อมูลพื้นที่ชุมชน</h1>
    <p>ระบบกำลังตั้งค่าการลงชื่อเข้าใช้ด้วยบัญชี Google<br>กรุณาติดต่อผู้ดูแลระบบเพื่อขอสิทธิ์ใช้งาน</p>
  </main>
</body>
</html>
